{% comment %}
  ProfilePage structured data for any page that sets `profile: true` in its
  front matter. `job_title` and `knows_about` are read from the same front
  matter so the data lives with the page it describes.
{% endcomment %}
{% if page.profile %}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "ProfilePage",
  "url": {{ page.url | absolute_url | jsonify }},
  "mainEntity": {
    "@type": "Person",
    "@id": {{ page.url | append: '#person' | absolute_url | jsonify }},
    "name": {{ site.social.name | jsonify }},
    "jobTitle": {{ page.job_title | jsonify }},
    "url": {{ '/' | absolute_url | jsonify }},
    "image": {{ site.avatar | absolute_url | jsonify }},
    "sameAs": {{ site.social.links | jsonify }},
    "knowsAbout": {{ page.knows_about | jsonify }}
  }
}
</script>
{% endif %}
